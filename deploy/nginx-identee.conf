# Nginx settings for identee.co.in — copy to /etc/nginx/sites-available/identee, then enable it
# (docs/DEPLOYMENT.md, step 6). Certbot adds the HTTPS parts to this file by itself (step 8).
#
# What it does:
#   /api/...      → forwarded to the backend (Node + Express, kept running by PM2) on port 3001
#   everything else → the built website files (frontend/dist), with index.html for app pages like /cart
#
# Change these two if needed:
#   root     → where the project's frontend/dist folder is on the server
#   3001     → the PORT in server/.env (only if 3001 is already used by another app)

server {
    listen 80;
    listen [::]:80;
    server_name identee.co.in www.identee.co.in;

    # Customers upload photos up to 10 MB (Nginx's own default is only 1 MB)
    client_max_body_size 25m;

    root /home/vinith/identee/frontend/dist;
    index index.html;

    # The API: forwarded to Express
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI pictures can take up to ~3 minutes (the default is 60 s)
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Old pictures saved on the server's own disk (before Cloudinary)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # Built files with a content hash in their name never change: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The website: real files as they are, every other address → index.html (React Router shows the page)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Big 3D models, the background-remover's files: let the browser cache them
    location ~* \.(glb|wasm|onnx)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Compress text files
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
