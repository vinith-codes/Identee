<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="rib" width="7" height="40" patternUnits="userSpaceOnUse">
      <rect width="7" height="40" fill="#D9D1C4"/>
      <line x1="3.5" y1="0" x2="3.5" y2="40" stroke="#B9AF9F" stroke-width="1.6"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
    </marker>
    <g id="tee">
      <!-- body (top part only) -->
      <path d="M40,150 L200,92 L360,92 L520,150 L520,600 L40,600 Z" fill="#ECE7DF" stroke="#3A3530" stroke-width="3" stroke-linejoin="round"/>
      <!-- inside of the back, seen through the neck opening -->
      <path d="M215,92 Q280,200 345,92 Z" fill="#BCB2A4"/>
      <!-- collar rib band: between the top edge (neck opening) and the seam -->
      <path d="M215,92 Q280,200 345,92 L362,92 Q280,250 198,92 Z" fill="url(#rib)" stroke="#3A3530" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="600" y="52" text-anchor="middle" font-size="32" font-weight="bold" fill="#141110">Where do you start measuring "from the collar"?</text>
  <text x="600" y="88" text-anchor="middle" font-size="20" fill="#5A524A">Example: Full Front, size S–M = 6 cm. Does the 6 cm start at line A or line B? (centre of the tee)</text>
  <text x="600" y="116" text-anchor="middle" font-size="18" fill="#5A524A">B puts the print about 2 cm lower than A — so we need to know which one you use.</text>

  <!-- ===== A: top of the collar ===== -->
  <g transform="translate(30,90)">
    <use href="#tee"/>
    <rect x="160" y="250" width="240" height="300" fill="none" stroke="#3A3530" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="280" y="410" text-anchor="middle" font-size="26" fill="#8A8176" font-weight="bold">PRINT</text>

    <!-- line A: top edge of the collar at the centre -->
    <line x1="215" y1="146" x2="345" y2="146" stroke="#B42318" stroke-width="4"/>
    <circle cx="280" cy="146" r="6" fill="#B42318"/>
    <line x1="280" y1="152" x2="280" y2="244" stroke="#B42318" stroke-width="4" marker-end="url(#head)"/>
    <rect x="292" y="180" width="70" height="34" rx="6" fill="#B42318"/>
    <text x="327" y="204" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">6 cm</text>
    <!-- callout -->
    <line x1="215" y1="146" x2="110" y2="62" stroke="#B42318" stroke-width="2"/>
    <text x="10" y="52" font-size="19" font-weight="bold" fill="#B42318">TOP edge of collar</text>
  </g>
  <text x="310" y="738" text-anchor="middle" font-size="26" font-weight="bold" fill="#141110">A · from the TOP of the collar  ☐</text>

  <!-- ===== B: the seam below the collar ===== -->
  <g transform="translate(630,90)">
    <use href="#tee"/>
    <rect x="160" y="275" width="240" height="300" fill="none" stroke="#3A3530" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="280" y="435" text-anchor="middle" font-size="26" fill="#8A8176" font-weight="bold">PRINT</text>

    <!-- line B: the seam where the collar joins the body, at the centre -->
    <line x1="200" y1="171" x2="360" y2="171" stroke="#B42318" stroke-width="4"/>
    <circle cx="280" cy="171" r="6" fill="#B42318"/>
    <line x1="280" y1="177" x2="280" y2="269" stroke="#B42318" stroke-width="4" marker-end="url(#head)"/>
    <rect x="292" y="205" width="70" height="34" rx="6" fill="#B42318"/>
    <text x="327" y="229" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">6 cm</text>
    <!-- callout -->
    <line x1="360" y1="171" x2="430" y2="70" stroke="#B42318" stroke-width="2"/>
    <text x="380" y="58" font-size="19" font-weight="bold" fill="#B42318">Collar SEAM</text>
  </g>
  <text x="910" y="738" text-anchor="middle" font-size="26" font-weight="bold" fill="#141110">B · from the SEAM below the collar  ☐</text>
</svg>
